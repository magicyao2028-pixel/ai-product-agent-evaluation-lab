[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-product-agent-evaluation-lab"
version = "0.6.0"
description = "Deterministic Agent evaluation with failure taxonomy, ordered run trends and release gates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "magicyao2028-pixel" }]
dependencies = []

[project.scripts]
agent-eval = "agent_evaluation_lab.cli:main"
agent-compare = "agent_evaluation_lab.comparison_cli:main"
agent-trend = "agent_evaluation_lab.trend_cli:main"
agent-review = "agent_evaluation_lab.review_cli:main"
agent-eval-trial = "agent_evaluation_lab.trial_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
