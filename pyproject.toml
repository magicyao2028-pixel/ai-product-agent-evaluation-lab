[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-product-agent-evaluation-lab"
version = "0.2.0"
description = "Deterministic release-gate evaluation for AI products and Agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "magicyao2028-pixel" }]
dependencies = []

[project.scripts]
agent-eval = "agent_evaluation_lab.cli:main"
agent-compare = "agent_evaluation_lab.comparison_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
